name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and interaction tests
        run: npm test

      - name: Run static analysis
        run: npm run lint

      - name: Build production bundle
        run: npm run build
